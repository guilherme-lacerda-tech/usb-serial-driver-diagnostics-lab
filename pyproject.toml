[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "usb-serial-driver-diagnostics-lab"
version = "0.1.0"
description = "Windows USB serial diagnostics lab with simulation mode, structured reports and Python tooling."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Guilherme Lacerda" }]
dependencies = [
  "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<10",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
usb-serial-diagnostics = "usb_serial_driver_diagnostics_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["usb_serial_driver_diagnostics_lab"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

